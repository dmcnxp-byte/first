name: Build Next.js

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build Next.js
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ secrets.NEXT_PUBLIC_SANITY_API_VERSION }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          LEAD_NOTIFICATION_EMAIL: ${{ secrets.LEAD_NOTIFICATION_EMAIL }}
          LEAD_EMAIL_FROM: ${{ secrets.LEAD_EMAIL_FROM }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npm run build

      - name: Prepare standalone deployment
        run: |
          rm -rf deploy
          mkdir -p deploy

          # Copy Next.js standalone server
          cp -R apps/web/.next/standalone/. deploy/

          # Copy public files
          mkdir -p deploy/apps/web/public
          cp -R apps/web/public/. deploy/apps/web/public/

          # Copy Next.js static files to apps/web/.next/static
          mkdir -p deploy/apps/web/.next/static
          cp -R apps/web/.next/static/. deploy/apps/web/.next/static/

          # Copy Next.js static files to root .next/static
          mkdir -p deploy/.next/static
          cp -R apps/web/.next/static/. deploy/.next/static/

          # Copy Next.js static files to root _next/static
          mkdir -p deploy/_next/static
          cp -R apps/web/.next/static/. deploy/_next/static/

          # Copy static files into public/_next/static
          mkdir -p deploy/apps/web/public/_next/static
          cp -R apps/web/.next/static/. deploy/apps/web/public/_next/static/

          # Create restart trigger
          mkdir -p deploy/tmp
          date > deploy/tmp/restart.txt

          echo "=== STATIC FILES ==="
          find deploy/apps/web/.next/static -type f | head -20

          echo "=== ROOT _next FILES ==="
          find deploy/_next/static -type f | head -20

          echo "=== PUBLIC _next FILES ==="
          find deploy/apps/web/public/_next/static -type f | head -20

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-standalone
          path: deploy/
          retention-days: 7

      - name: Deploy Next.js application to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./deploy/
          server-dir: ./
          dry-run: false

      - name: Deploy Next.js static assets to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_PUBLIC_USERNAME }}
          password: ${{ secrets.FTP_PUBLIC_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./deploy/_next/
          server-dir: ./_next/
          dry-run: false
