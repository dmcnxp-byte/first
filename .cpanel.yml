---
deployment:
  tasks:
    - export APP="/home/dnyanalugh/nextjs-cpanel-test"

    - /bin/mkdir -p "$APP"

    - /bin/cp -R apps "$APP/"
    - /bin/cp package.json package-lock.json "$APP/"

    - cd "$APP" && /home/dnyanalugh/nodevenv/nextjs-cpanel-test/20/bin/npm ci --ignore-scripts
    - export NODE_OPTIONS="--disable-wasm-trap-handler"
    - cd "$APP" && /home/dnyanalugh/nodevenv/nextjs-cpanel-test/20/bin/npm run build --workspace=apps/web

    - /bin/mkdir -p "$APP/tmp"
    - /bin/touch "$APP/tmp/restart.txt"